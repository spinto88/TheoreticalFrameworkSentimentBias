[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiment-bias"
version = "0.1.0"
description = "Probabilistic model for latent sentiment bias in media coverage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sebastián Pinto", email = "spinto@df.uba.ar" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
nb = ["jupyter", "matplotlib", "requests"]

[project.scripts]
sentiment-bias-api = "sentiment_bias.api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_bias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: corre el optimizador de verdad en vez de mockearlo",
]
